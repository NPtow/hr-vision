# Install as /etc/systemd/system/hr-vision-api.service.d/materials.conf only
# after the hash-locked Python 3.12 environment and private storage are ready.
[Service]
EnvironmentFile=/etc/hr-vision/materials.env
ExecStart=
ExecStart=/opt/hr-vision-materials/venv/bin/python /opt/hr-vision-api/current/app.py
