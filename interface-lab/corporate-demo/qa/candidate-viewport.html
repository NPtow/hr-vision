<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate viewport QA</title>
<style>body{margin:0;padding:12px;background:#dde2e8;font:14px system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:10px;border:1px solid #bfc8d3;border-radius:8px;background:white}iframe{display:block;border:0;background:#f7f6f2;margin:0 auto;width:390px;height:844px;max-width:none}</style></head><body>
<nav><button data-width="390">390 × 844</button><button data-width="320">320 × 568</button><button data-hash="top">Начало</button><button data-hash="one-interview">Интервью</button><button data-hash="employers">Работодатели</button><button data-hash="invitations">Приглашения</button><button data-hash="manager">Руководитель</button><button data-hash="start">Финал</button></nav>
<iframe id="candidate-frame" title="Кандидатская страница — адаптивная проверка" src="../candidates.html#top"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.width==='320'?'568px':'844px'});document.querySelectorAll('[data-hash]').forEach(button=>button.onclick=()=>{frame.src='../candidates.html#'+button.dataset.hash});</script>
</body></html>
