<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Встреча · Zoom</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111214; color: #eee; font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    #connection-notice { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; text-align: center; }
    #connection-notice[hidden] { display: none; }
    #connection-notice h1 { font-size: 24px; font-weight: 600; margin: 0 0 12px; }
    #connection-notice p { max-width: 440px; color: #b8bbc4; margin: 0; }
    #connection-notice a { color: #d3c9ff; display: inline-block; margin-top: 24px; }
    #connection-notice a[hidden] { display: none; }
  </style>
  <script type="importmap">
    {"imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
    }}
  </script>
</head>
<body>
  <main id="connection-notice" role="status" aria-live="polite">
    <h1 id="connection-title">Подключаем Zoom</h1>
    <p id="connection-description">Загружаем окно встречи.</p>
    <a id="back-link" href="/" target="_top" hidden>Вернуться к макету</a>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
