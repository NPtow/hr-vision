[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-transcription-source"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["fastapi==0.162.0", "starlette==1.9.0", "pydantic==2.14.1", "uvicorn==0.54.0", "httpx==0.28.1", "celery==5.6.3", "boto3==1.43.118"]
[project.optional-dependencies]
test = ["pytest==8.3.5"]
[project.scripts]
hr-transcription-source = "hr_transcription_source.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
