[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-materials-core"
version = "1.0.0"
description = "Provider-independent HR materials catalogue and receipt API"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.162.0", "starlette==1.9.0", "pydantic==2.14.1",
  "uvicorn==0.54.0", "boto3==1.43.118",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.5"]

[project.scripts]
hr-materials-core = "hr_materials_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
