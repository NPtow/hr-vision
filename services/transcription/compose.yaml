name: md-transcription

x-service: &service
  build: .
  image: md-transcription:local
  restart: unless-stopped
  init: true
  environment: &environment
    TRANSCRIPTION_DATA_DIR: /var/lib/transcription
    TRANSCRIPTION_API_KEYS: ${TRANSCRIPTION_API_KEYS:?Configure unique service keys}
    TRANSCRIPTION_BROKER_URL: ${TRANSCRIPTION_BROKER_URL:-}
    TRANSCRIPTION_BACKEND_KIND: ${TRANSCRIPTION_BACKEND_KIND:-http}
    TRANSCRIPTION_DEEPGRAM_API_KEY: ${TRANSCRIPTION_DEEPGRAM_API_KEY:-}
    TRANSCRIPTION_DEEPGRAM_MODEL: ${TRANSCRIPTION_DEEPGRAM_MODEL:-nova-3}
    TRANSCRIPTION_DEEPGRAM_LANGUAGE: ${TRANSCRIPTION_DEEPGRAM_LANGUAGE:-ru}
    TRANSCRIPTION_DEEPGRAM_DIARIZE: ${TRANSCRIPTION_DEEPGRAM_DIARIZE:-true}
    TRANSCRIPTION_DEEPGRAM_DIARIZE_MODEL: ${TRANSCRIPTION_DEEPGRAM_DIARIZE_MODEL:-v2}
    TRANSCRIPTION_DEEPGRAM_CONFIG_REVISION: ${TRANSCRIPTION_DEEPGRAM_CONFIG_REVISION:-1}
    TRANSCRIPTION_SPEECHKIT_API_KEY: ${TRANSCRIPTION_SPEECHKIT_API_KEY:-}
    TRANSCRIPTION_SPEECHKIT_FOLDER_ID: ${TRANSCRIPTION_SPEECHKIT_FOLDER_ID:-}
    TRANSCRIPTION_SPEECHKIT_MODEL: ${TRANSCRIPTION_SPEECHKIT_MODEL:-general}
    TRANSCRIPTION_SPEECHKIT_LANGUAGE: ${TRANSCRIPTION_SPEECHKIT_LANGUAGE:-ru-RU}
    TRANSCRIPTION_SPEECHKIT_SPEAKER_LABELING: ${TRANSCRIPTION_SPEECHKIT_SPEAKER_LABELING:-false}
    TRANSCRIPTION_SPEECHKIT_CONFIG_REVISION: ${TRANSCRIPTION_SPEECHKIT_CONFIG_REVISION:-1}
    TRANSCRIPTION_STAGING_S3_BUCKET: ${TRANSCRIPTION_STAGING_S3_BUCKET:-}
    TRANSCRIPTION_STAGING_S3_PREFIX: ${TRANSCRIPTION_STAGING_S3_PREFIX:-speechkit-staging/}
    TRANSCRIPTION_STAGING_S3_ACCESS_KEY: ${TRANSCRIPTION_STAGING_S3_ACCESS_KEY:-}
    TRANSCRIPTION_STAGING_S3_SECRET_KEY: ${TRANSCRIPTION_STAGING_S3_SECRET_KEY:-}
    TRANSCRIPTION_MAX_INPUT_BYTES: ${TRANSCRIPTION_MAX_INPUT_BYTES:-1073741824}
    TRANSCRIPTION_MAX_RESULT_BYTES: ${TRANSCRIPTION_MAX_RESULT_BYTES:-20971520}
    TRANSCRIPTION_MEDIA_MAX_DURATION_SECONDS: ${TRANSCRIPTION_MEDIA_MAX_DURATION_SECONDS:-14400}
    TRANSCRIPTION_MEDIA_MAX_AUDIO_BYTES: ${TRANSCRIPTION_MEDIA_MAX_AUDIO_BYTES:-1073741824}
    TRANSCRIPTION_MEDIA_TIMEOUT_SECONDS: ${TRANSCRIPTION_MEDIA_TIMEOUT_SECONDS:-900}
    TRANSCRIPTION_SPEECHKIT_POLL_SECONDS: ${TRANSCRIPTION_SPEECHKIT_POLL_SECONDS:-10}
    TRANSCRIPTION_ASR_TIMEOUT_SECONDS: ${TRANSCRIPTION_ASR_TIMEOUT_SECONDS:-300}
    TRANSCRIPTION_LEASE_SECONDS: ${TRANSCRIPTION_LEASE_SECONDS:-600}
    TRANSCRIPTION_MAX_ATTEMPTS: ${TRANSCRIPTION_MAX_ATTEMPTS:-3}
    AWS_EC2_METADATA_DISABLED: 'true'
    TRANSCRIPTION_ASR_URL: ${TRANSCRIPTION_ASR_URL:-}
    TRANSCRIPTION_ASR_MODEL: ${TRANSCRIPTION_ASR_MODEL:-}
    TRANSCRIPTION_ASR_API_KEY: ${TRANSCRIPTION_ASR_API_KEY:-}
    TRANSCRIPTION_ASR_RESPONSE_FORMAT: ${TRANSCRIPTION_ASR_RESPONSE_FORMAT:-verbose_json}
    TRANSCRIPTION_ALLOW_INSECURE_ASR_HTTP: ${TRANSCRIPTION_ALLOW_INSECURE_ASR_HTTP:-false}
  volumes:
    - transcription-data:/var/lib/transcription
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 16m
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 128

services:
  api:
    <<: *service
    ports:
      - "127.0.0.1:${TRANSCRIPTION_PORT:-8093}:8080"
    command: [python, -m, md_transcription, api, --host, 0.0.0.0]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *service
    profiles: [asr]
    command: [python, -m, md_transcription, worker]
  scheduler:
    <<: *service
    profiles: [asr]
    command: [python, -m, md_transcription, beat]

volumes:
  transcription-data:
