[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "md-transcription"
version = "0.1.0"
description = "Independent, provider-neutral transcription API and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.9.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "celery==5.6.3",
  "SQLAlchemy==2.1.6",
  "requests==2.34.2",
  "aiohttp==3.14.5",
  "pysubs2==1.9.0",
]

[project.scripts]
md-transcription = "md_transcription.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
