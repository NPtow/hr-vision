name: hr-transcription

x-base: &base
  image: ${HR_TRANSCRIPTION_IMAGE:?Set a reviewed immutable release image}
  restart: unless-stopped
  init: true
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  cpus: 0.5
  mem_limit: 192m
  memswap_limit: 192m
  tmpfs: ['/tmp:size=32m,mode=1777']
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}

x-asr: &asr
  <<: *base
  env_file: /etc/hr-vision-asr/asr.env
  volumes: [/var/lib/hr-vision-asr:/var/lib/transcription]
  stop_grace_period: 16m

x-source: &source
  <<: *base
  env_file: /etc/hr-vision-asr/source.env
  volumes: [/var/lib/hr-transcription-source:/var/lib/hr-transcription-source]
  stop_grace_period: 6m

services:
  asr-api:
    <<: *asr
    command: [python, -m, md_transcription, api, --host, 127.0.0.1, --port, '8106']
  asr-worker:
    <<: *asr
    command: [python, -m, md_transcription, worker]
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
  asr-scheduler:
    <<: *asr
    command: [python, -m, md_transcription, beat]
    mem_limit: 128m
    memswap_limit: 128m
  source-api:
    <<: *source
    command: [python, -m, hr_transcription_source, api, --port, '8107']
  source-worker:
    <<: *source
    command: [python, -m, hr_transcription_source, worker]
    mem_limit: 256m
    memswap_limit: 256m
  source-scheduler:
    <<: *source
    command: [python, -m, hr_transcription_source, scheduler]
    mem_limit: 128m
    memswap_limit: 128m
