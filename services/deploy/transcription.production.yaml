# Standalone production profile: normalization API only, separately released image.
# Does not extend the upstream development build or activate ASR workers.
name: hr-vision-transcription
services:
  api:
    image: ${TRANSCRIPTION_IMAGE:?immutable transcription image required}
    pull_policy: never
    user: 10001:10001
    command: [python, -m, md_transcription, api, --host, 0.0.0.0]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777]
    stop_signal: SIGTERM
    stop_grace_period: 90s
    ports: ['127.0.0.1:8093:8080']
    env_file:
      - path: ${MATERIALS_CONFIG_DIR:?private config directory required}/transcription.env
        format: raw
    environment:
      TRANSCRIPTION_DATA_DIR: /var/lib/transcription
      TRANSCRIPTION_BROKER_URL: ''
      TRANSCRIPTION_ASR_URL: ''
      TRANSCRIPTION_ASR_MODEL: ''
      TRANSCRIPTION_ASR_API_KEY: ''
    volumes:
      - type: bind
        source: /var/lib/md-transcription
        target: /var/lib/transcription
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 20s
