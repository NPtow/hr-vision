<svg xmlns="http://www.w3.org/2000/svg" width="2450" height="1800" viewBox="0 0 2450 1800">
<title>03 / Пока компания выбирает, кандидат тоже выбирает</title>
<rect width="2450" height="1800" fill="#f4f1e8"/>
<text x="32" y="28" fill="#20211f" font-size="36" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="32" y="62.56">03 / Пока компания выбирает, кандидат тоже выбирает</tspan>
</text>
<text x="32" y="90" fill="#696b65" font-size="20" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="32" y="109.2">Одна вакансия сравнивает много кандидатов; один кандидат ведёт несколько вакансий. Не потерять взаимный интерес.</tspan>
</text>
<polyline points="24,215 2426,215" fill="none" stroke="#d6d4cc" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="32" y="227" fill="#20211f" font-size="21" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="32" y="247.16">Нанимающий менеджер</tspan>
</text>
<polyline points="24,665 2426,665" fill="none" stroke="#d6d4cc" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="32" y="677" fill="#20211f" font-size="21" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="32" y="697.16">HR / агентство</tspan>
</text>
<polyline points="24,1115 2426,1115" fill="none" stroke="#d6d4cc" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="32" y="1127" fill="#20211f" font-size="21" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="32" y="1147.16">Кандидат</tspan>
</text>
<polyline points="470,385 555,385" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M544,390.25 L555,385 L544,379.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="945,385 1030,385" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1019,390.25 L1030,385 L1019,379.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1420,385 1505,385" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1494,390.25 L1505,385 L1494,379.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1895,385 1980,385" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1969,390.25 L1980,385 L1969,379.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="945,835 1030,835" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1019,840.25 L1030,835 L1019,829.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1420,835 1505,835" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1494,840.25 L1505,835 L1494,829.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="750,500 750,720" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M744.75,709 L750,720 L755.25,709" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1225,720 1225,500" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1230.25,511 L1225,500 L1219.75,511" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1700,500 1700,720" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1694.75,709 L1700,720 L1705.25,709" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="470,1285 555,1285" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M544,1290.25 L555,1285 L544,1279.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="945,1285 1030,1285" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1019,1290.25 L1030,1285 L1019,1279.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1420,1285 1505,1285" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1494,1290.25 L1505,1285 L1494,1279.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1895,1285 1980,1285" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1969,1290.25 L1980,1285 L1969,1279.75" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="750,1170 750,950" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M755.25,961 L750,950 L744.75,961" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1225,1170 1225,950" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1230.25,961 L1225,950 L1219.75,961" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<polyline points="1700,950 1700,1170" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M1694.75,1159 L1700,1170 L1705.25,1159" fill="none" stroke="#20211f" stroke-width="1.5" stroke-linejoin="miter" data-arrowhead="true"/>
<rect x="80" y="270" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="98" y="288" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="311.04">Сравнивать нескольких</tspan>
</text>
<text x="98" y="326.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="344.08">Вакансия A: кандидаты 07, 12, 31.</tspan>
<tspan x="98" y="367.48">Решение по каждому ещё открыто.</tspan>
</text>
<text x="98" y="383.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="397.04">Д58</tspan>
</text>
<rect x="555" y="270" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="573" y="288" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="311.04">Есть сильный кандидат</tspan>
</text>
<text x="573" y="326.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="344.08">Интерес есть, но сравнение и</tspan>
<tspan x="573" y="367.48">согласование ещё продолжаются.</tspan>
</text>
<text x="573" y="383.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="397.04">У; Д17,58</tspan>
</text>
<rect x="1030" y="270" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1048" y="288" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="311.04">Когда готовы решить?</tspan>
</text>
<text x="1048" y="326.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="344.08">Понять оставшиеся вопросы и реальный</tspan>
<tspan x="1048" y="367.48">срок своего решения.</tspan>
</text>
<text x="1048" y="383.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="397.04">У; вывод</tspan>
</text>
<rect x="1505" y="270" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1523" y="288" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="311.04">Снять риск потери</tspan>
</text>
<text x="1523" y="326.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="344.08">Ускорить проверку/согласование,</tspan>
<tspan x="1523" y="367.48">прояснить ценность и важные условия.</tspan>
</text>
<text x="1523" y="383.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="397.04">У; действия — гипотеза</tspan>
</text>
<rect x="1980" y="270" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1998" y="288" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="311.04">Сделать следующий шаг</tspan>
</text>
<text x="1998" y="326.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="344.08">Решение, оффер или честный отказ. Не</tspan>
<tspan x="1998" y="367.48">оставлять человека без ясности.</tspan>
</text>
<text x="1998" y="383.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="397.04">У; Д17; вывод</tspan>
</text>
<rect x="555" y="720" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="573" y="738" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="761.04">Уточнять интерес и сроки</tspan>
</text>
<text x="573" y="776.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="794.08">Что важно кандидату; какие другие</tspan>
<tspan x="573" y="817.48">процессы и дедлайны он готов</tspan>
<tspan x="573" y="840.88">сообщить.</tspan>
</text>
<text x="573" y="857" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="870.44">У; Д17,57; вывод</tspan>
</text>
<rect x="1030" y="720" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1048" y="738" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="761.04">Сопоставить сроки</tspan>
</text>
<text x="1048" y="776.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="794.08">Есть конкурирующий оффер или</tspan>
<tspan x="1048" y="817.48">задержка: согласовать следующий</tspan>
<tspan x="1048" y="840.88">контакт и решение.</tspan>
</text>
<text x="1048" y="857" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="870.44">У; механизм — гипотеза</tspan>
</text>
<rect x="1505" y="720" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1523" y="738" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="761.04">Поддержать ясность</tspan>
</text>
<text x="1523" y="776.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="794.08">Ответить на вопросы, подтвердить</tspan>
<tspan x="1523" y="817.48">встречу и срок. Держать обе стороны в</tspan>
<tspan x="1523" y="840.88">курсе.</tspan>
</text>
<text x="1523" y="857" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="870.44">У; В45; вывод</tspan>
</text>
<rect x="80" y="1170" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="98" y="1188" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="1211.04">Продолжать поиск</tspan>
</text>
<text x="98" y="1226.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="1244.08">Не прекращать другие заявки и встречи</tspan>
<tspan x="98" y="1267.48">только из-за интереса компании.</tspan>
</text>
<text x="98" y="1283.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="98" y="1297.04">У; Д16–17</tspan>
</text>
<rect x="555" y="1170" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="573" y="1188" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="1211.04">Идти по A / B / C</tspan>
</text>
<text x="573" y="1226.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="1244.08">Один профиль и запись; решения и</tspan>
<tspan x="573" y="1267.48">обратная связь отдельны по вакансиям.</tspan>
</text>
<text x="573" y="1283.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="573" y="1297.04">Д17,58</tspan>
</text>
<rect x="1030" y="1170" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1048" y="1188" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="1211.04">Сравнивать предложения</tspan>
</text>
<text x="1048" y="1226.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="1244.08">Несколько офферов дают выбор и</tspan>
<tspan x="1048" y="1267.48">возможность переговоров.</tspan>
</text>
<text x="1048" y="1283.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1048" y="1297.04">Д17</tspan>
</text>
<rect x="1505" y="1170" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1523" y="1188" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="1211.04">Обновлять своё решение</tspan>
</text>
<text x="1523" y="1226.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="1244.08">Другой оффер или новые условия</tspan>
<tspan x="1523" y="1267.48">меняют интерес и доступность.</tspan>
</text>
<text x="1523" y="1283.6" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1523" y="1297.04">У; Д57; вывод</tspan>
</text>
<rect x="1980" y="1170" width="390" height="230" rx="12" fill="#f4f1e8" stroke="#20211f" stroke-width="1.5"/>
<text x="1998" y="1188" fill="#20211f" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="1211.04">Продолжить или уйти</tspan>
</text>
<text x="1998" y="1226.8" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="1244.08">Выбрать эту работу / другую /</tspan>
<tspan x="1998" y="1267.48">продолжить поиск. Сообщить причину,</tspan>
<tspan x="1998" y="1290.88">если готов.</tspan>
</text>
<text x="1998" y="1307" fill="#696b65" font-size="14" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="1998" y="1320.44">Д3,17; вывод</tspan>
</text>
<text x="80" y="1510" fill="#696b65" font-size="22" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="80" y="1531.12">Если кандидат ушёл: причина → условия работодателя / другой кандидат. Если отказала компания: причина → следующие вакансии кандидата. Это разные петли.</tspan>
</text>
<text x="80" y="1600" fill="#696b65" font-size="20" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="80" y="1619.2">Профиль человека ≠ статус пары «кандидат × вакансия» ≠ общая доступность. Отказ по A не закрывает B. Один найм не означает автоматически, что человек доступен всем.</tspan>
</text>
<text x="80" y="1690" fill="#696b65" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif">
<tspan x="80" y="1707.28">Не подтверждено: конкретный SLA ответа, правила резерва и способ измерять риск потери. В v1 это вопросы для процесса, не готовые функции.</tspan>
</text>
</svg>
